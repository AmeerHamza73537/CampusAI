<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>University Chatbot</title>
    <link rel="stylesheet" href="/static/style.css">
  </head>
  <body>
    <div class="chat-container">
      <header>University Chatbot</header>
      <div id="chat" class="chat-box"></div>
      <div id="form" class="input-area">
        <input id="msg" placeholder="Type your message..." autocomplete="off" />
        <button type="button" onclick="sendMessage()">Send</button>
      </div>
    </div>

    <script>
    // Persistent debug panel and helpers
    function createDebugPanel(){
      let d = document.getElementById('debug');
      if(!d){
        d = document.createElement('div');
        d.id = 'debug';
        d.style = 'position:fixed;right:10px;bottom:10px;width:340px;max-height:240px;overflow:auto;background:rgba(0,0,0,0.8);color:#8ef;font-family:monospace;font-size:12px;padding:8px;border-radius:6px;z-index:9999';
        document.body.appendChild(d);
      }
      return d;
    }

    function logDebug(...args){
      console.log(...args);
      try{
        const d = createDebugPanel();
        const el = document.createElement('div');
        el.textContent = args.map(a => (typeof a === 'object' ? JSON.stringify(a) : String(a))).join(' ');
        d.appendChild(el);
        d.scrollTop = d.scrollHeight;
        const hist = JSON.parse(localStorage.getItem('debugHist') || '[]');
        hist.push(el.textContent);
        if(hist.length > 200) hist.shift();
        localStorage.setItem('debugHist', JSON.stringify(hist));
      }catch(e){ /* ignore */ }
    }

    // Restore previous debug history
    window.addEventListener('DOMContentLoaded', ()=>{
      try{
        const d = createDebugPanel();
        const hist = JSON.parse(localStorage.getItem('debugHist') || '[]');
        hist.forEach(line => { const el = document.createElement('div'); el.textContent = line; d.appendChild(el); });
      }catch(e){}
      // Prevent any accidental form submissions
      document.addEventListener('submit', function(e){ logDebug('prevented submit on', e.target); e.preventDefault(); }, true);
      // Intercept Enter key on the message input
      const input = document.getElementById('msg');
      if(input){
        input.addEventListener('keydown', function(e){ if(e.key === 'Enter'){ e.preventDefault(); logDebug('Enter pressed — sending'); sendMessage(); } });
      }
    });

    async function sendMessage() {
      const input = document.getElementById('msg');
      const text = input.value.trim();
      if(!text) return;
      // show user bubble immediately and log
      addBubble('user', text);
      logDebug('Client: sending message ->', text);
      // disable input while waiting for response
      input.disabled = true;
      try {
        const resp = await fetch('/predict', {
          method: 'POST', headers: {'Content-Type':'application/json'},
          body: JSON.stringify({message: text})
        });
        logDebug('Client: fetch completed, status=', resp.status);
        if (!resp.ok) {
          const txt = await resp.text();
          console.error('Client: server error', resp.status, txt);
          addBubble('bot', 'Error: server returned ' + resp.status);
          logDebug('Server error body:', txt);
        } else {
          const data = await resp.json();
          logDebug('Client: received data ->', data);
          addBubble('bot', data.response || 'No response');
        }
      } catch (err) {
        console.error('Client: fetch failed', err);
        addBubble('bot', 'Network error: ' + (err.message || err));
        logDebug('Fetch exception:', err);
      } finally {
        input.disabled = false;
        input.value = '';
        input.focus();
      }
    }

    function addBubble(who, text) {
      const box = document.getElementById('chat');
      const el = document.createElement('div');
      el.className = 'bubble ' + who;
      el.textContent = text;
      box.appendChild(el);
      box.scrollTop = box.scrollHeight;
      logDebug('Client: added bubble', who, text);
    }

    // global error handlers to surface unexpected errors
    window.addEventListener('error', function(e){
      console.error('Uncaught error:', e.error || e.message);
      addBubble('bot', 'Client error: ' + (e.message || e.error));
      logDebug('Uncaught error:', e.error || e.message);
    });
    window.addEventListener('unhandledrejection', function(e){
      console.error('Unhandled rejection:', e.reason);
      addBubble('bot', 'Client promise error');
      logDebug('Unhandled rejection:', e.reason);
    });
    </script>
  </body>
</html>
